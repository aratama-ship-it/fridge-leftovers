name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 共有サーバーの検証が node:sqlite（Node 22から）を使う
          node-version: "22"

      # 食材の初期数量と単位が、一般的な買い方から外れていないか
      - name: 初期単位チェック
        run: node scripts/check-initial-units.mjs

      # 壊れた保存値をサンプル在庫で上書きせず、安全に空から始められるか
      - name: 在庫読み込みのフォールバック
        run: node scripts/check-inventory-load.mjs

      # 主役リストが今のレシピと食い違っていないか
      - name: 主役リストの整合
        run: node scripts/pick-lead-ingredients.mjs --check

      # レシートの行が正しい食材へ当たるか（総称に先取りされる事故の検出）
      - name: レシート照合チェック
        run: node scripts/check-receipt-matching.mjs

      # 共有サーバー（Cloudflare Worker）を node:sqlite で動かして確かめる
      - name: 共有サーバーのチェック
        run: node worker/check-worker.mjs

      # 在庫とレシピの突き合わせ（不足判定・代用・単位換算・数量の確信度）
      - name: レシピ判定チェック
        run: node scripts/check-recipe-logic.mjs

      # index.html の ?v= と sw.js の版・先読みリストが中身と合っているか
      - name: キャッシュ回避クエリの整合
        run: node scripts/cache-version.mjs --check

      # app.jsが参照するイラストのシート名と、styles.cssのアトラスCSSクラスが噛み合っているか
      - name: アトラス参照の整合
        run: node scripts/check-atlas-references.mjs

      # ホーム画面のアイコンが、今の版下から書き出したものと一致しているか
      - name: アイコンの整合
        run: node scripts/build-icons.mjs --check

      # アトラスの背景がちゃんと抜けているか（緑背景の混入の検出）
      - name: アトラスの背景抜け
        run: node scripts/check-atlas-alpha.mjs all

      # Service Worker のキャッシュ2層化（更新でイラストを捨てないこと）
      - name: Service Worker のチェック
        run: node scripts/check-sw.mjs
