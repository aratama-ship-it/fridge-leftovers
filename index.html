  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;fridge-decision-prototype&quot;&gt;
  &lt;div class=&quot;fdp-toolbar&quot; aria-label=&quot;提案条件&quot;&gt;
    &lt;fieldset class=&quot;fdp-fieldset&quot;&gt;
      &lt;legend&gt;今日は何人分？&lt;/legend&gt;
      &lt;div class=&quot;fdp-person-buttons&quot; id=&quot;fdp-servings&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-servings=&quot;1&quot; aria-pressed=&quot;true&quot;&gt;1人&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-servings=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;2人&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-servings=&quot;4&quot; aria-pressed=&quot;false&quot;&gt;4人&lt;/button&gt;
      &lt;/div&gt;
    &lt;/fieldset&gt;
    &lt;label class=&quot;form-label fdp-priority-label&quot; for=&quot;fdp-priority&quot;&gt;
      今いちばん大事なこと
      &lt;select class=&quot;form-select&quot; id=&quot;fdp-priority&quot;&gt;
        &lt;option value=&quot;no-shop&quot;&gt;買い足しなし&lt;/option&gt;
        &lt;option value=&quot;rescue&quot;&gt;キャベツを使い切る&lt;/option&gt;
        &lt;option value=&quot;quick&quot;&gt;10分前後で作る&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;details class=&quot;fdp-inventory&quot;&gt;
    &lt;summary&gt;
      &lt;span id=&quot;fdp-inventory-summary&quot;&gt;冷蔵庫に5品&lt;/span&gt;
      &lt;span class=&quot;text-small&quot;&gt;今日確認&lt;/span&gt;
    &lt;/summary&gt;
    &lt;div class=&quot;fdp-inventory-body&quot;&gt;
      &lt;ul class=&quot;fdp-shelf&quot; id=&quot;fdp-shelf&quot;&gt;&lt;/ul&gt;
      &lt;p class=&quot;text-small fdp-pantry&quot;&gt;基本調味料：油、醤油、味噌、砂糖、塩、小麦粉&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

  &lt;section class=&quot;fdp-suggestions&quot; aria-labelledby=&quot;fdp-suggestions-title&quot;&gt;
    &lt;div class=&quot;fdp-section-head&quot;&gt;
      &lt;h3 id=&quot;fdp-suggestions-title&quot;&gt;今日の三択&lt;/h3&gt;
      &lt;span class=&quot;text-small&quot; id=&quot;fdp-condition-summary&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;fdp-recipes&quot; role=&quot;radiogroup&quot; aria-label=&quot;料理候補&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;card fdp-detail&quot; id=&quot;fdp-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/section&gt;
  &lt;p class=&quot;fdp-status text-small&quot; id=&quot;fdp-status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;style&gt;
  #fridge-decision-prototype {
    color: var(--foreground);
    width: 100%;
  }

  #fridge-decision-prototype * {
    box-sizing: border-box;
  }

  #fridge-decision-prototype .fdp-toolbar {
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr;
    padding-bottom: 16px;
  }

  #fridge-decision-prototype .fdp-fieldset {
    border: 0;
    margin: 0;
    min-width: 0;
    padding: 0;
  }

  #fridge-decision-prototype legend,
  #fridge-decision-prototype .fdp-priority-label {
    color: var(--muted-foreground);
    font-weight: 500;
    margin: 0 0 8px;
  }

  #fridge-decision-prototype .fdp-priority-label {
    display: grid;
    gap: 8px;
  }

  #fridge-decision-prototype .fdp-person-buttons {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  #fridge-decision-prototype .fdp-inventory {
    border-bottom: 1px solid var(--border);
  }

  #fridge-decision-prototype .fdp-inventory summary {
    align-items: center;
    cursor: pointer;
    display: flex;
    font-weight: 500;
    justify-content: space-between;
    padding: 14px 2px;
  }

  #fridge-decision-prototype .fdp-inventory-body {
    padding-bottom: 14px;
  }

  #fridge-decision-prototype .fdp-suggestions {
    padding: 20px 0;
  }

  #fridge-decision-prototype .fdp-section-head {
    align-items: baseline;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  #fridge-decision-prototype h3,
  #fridge-decision-prototype p {
    margin-top: 0;
  }

  #fridge-decision-prototype .fdp-shelf {
    border-bottom: 1px solid var(--border);
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #fridge-decision-prototype .fdp-shelf-item {
    align-items: center;
    border-top: 1px solid var(--border);
    display: grid;

  #fridge-decision-prototype .fdp-shelf-item.is-used {

  #fridge-decision-prototype .fdp-ingredient {

  #fridge-decision-prototype .fdp-amount {

  #fridge-decision-prototype .fdp-recipe {
    align-items: start;

  #fridge-decision-prototype .fdp-recipe:last-child {

  #fridge-decision-prototype .fdp-recipe label {

  #fridge-decision-prototype .fdp-recipe-meta {
    color: var(--muted-foreground);
  }

  #fridge-decision-prototype .fdp-missing {
    color: var(--foreground);
  }

  #fridge-decision-prototype .fdp-detail {
    display: grid;
    gap: 14px;
  }

  #fridge-decision-prototype .fdp-detail-head {
    align-items: start;
    display: flex;
    gap: 16px;
    justify-content: space-between;
  }

  #fridge-decision-prototype .fdp-detail h3,
  #fridge-decision-prototype .fdp-detail p {
    margin-bottom: 0;
  }

  #fridge-decision-prototype .fdp-detail-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr;
  }

  #fridge-decision-prototype .fdp-detail-label {
    color: var(--muted-foreground);

    margin-bottom: 4px;
  }

  #fridge-decision-prototype .fdp-options {

  }

  #fridge-decision-prototype .fdp-option-list {

  }

  #fridge-decision-prototype .fdp-option-row {
    align-items: start;
    display: grid;
    gap: 8px;

  }

  #fridge-decision-prototype .fdp-option-note {
    color: var(--muted-foreground);
    display: block;
  }

  #fridge-decision-prototype .fdp-actions {
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
    padding-top: 14px;
  }

  #fridge-decision-prototype .fdp-status {
    color: var(--muted-foreground);
    margin: 10px 0 0;
    min-height: 1.5em;
    text-align: center;
  }

  @media (min-width: 640px) {
    #fridge-decision-prototype .fdp-toolbar {
      align-items: end;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.8fr);
    }

    #fridge-decision-prototype .fdp-detail-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #fridge-decision-prototype .fdp-option-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }
  }
&lt;/style&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;fridge-decision-prototype&quot;);
    const servingsControls = root.querySelectorAll(&quot;[data-servings]&quot;);
    const prioritySelect = root.querySelector(&quot;#fdp-priority&quot;);
    const shelf = root.querySelector(&quot;#fdp-shelf&quot;);
    const recipesElement = root.querySelector(&quot;#fdp-recipes&quot;);
    const detail = root.querySelector(&quot;#fdp-detail&quot;);
    const status = root.querySelector(&quot;#fdp-status&quot;);
    const conditionSummary = root.querySelector(&quot;#fdp-condition-summary&quot;);
    const inventorySummary = root.querySelector(&quot;#fdp-inventory-summary&quot;);

    const initialInventory = [
      { id: &quot;cabbage&quot;, name: &quot;キャベツ&quot;, amount: 180, unit: &quot;g&quot;, display: &quot;少し・約180g&quot; },
      { id: &quot;eggs&quot;, name: &quot;卵&quot;, amount: 3, unit: &quot;個&quot;, display: &quot;3個&quot; },
      { id: &quot;mushroom&quot;, name: &quot;しめじ&quot;, amount: 0.5, unit: &quot;株&quot;, display: &quot;1/2株&quot; },
      { id: &quot;pork&quot;, name: &quot;豚こま&quot;, amount: 120, unit: &quot;g&quot;, display: &quot;約120g&quot; },
      { id: &quot;rice&quot;, name: &quot;ごはん&quot;, amount: 1, unit: &quot;膳&quot;, display: &quot;1膳&quot; }
    ];

    let inventory = initialInventory.map((item) =&gt; ({ ...item }));
    let servings = 1;
    let priority = &quot;no-shop&quot;;
    let selectedRecipeId = &quot;miso-stir-fry&quot;;
    const optionalSelections = {};

    const recipes = [
      {
        id: &quot;miso-stir-fry&quot;,
        name: &quot;豚こまとキャベツの味噌炒め&quot;,
        minutes: 12,
        baseServings: 1,
        uses: { cabbage: 150, pork: 100 },
        optional: [
          { id: &quot;mushroom&quot;, name: &quot;しめじ&quot;, amount: 0.25, unit: &quot;株&quot;, benefit: &quot;量と食感が増す&quot; },
          { id: &quot;ginger&quot;, name: &quot;しょうが&quot;, amount: 10, unit: &quot;g&quot;, benefit: &quot;香りが締まる&quot; },
          { id: &quot;sesame-oil&quot;, name: &quot;ごま油&quot;, amount: 1, unit: &quot;小さじ&quot;, benefit: &quot;仕上げが香ばしくなる&quot; }
        ],
        pantry: &quot;味噌・醤油・砂糖・油&quot;,
        method: &quot;豚肉を先に焼き、野菜を加えて強火でまとめる&quot;,
        rescue: 3
      },
      {
        id: &quot;egg-bowl&quot;,
        name: &quot;ふんわり卵とじ丼&quot;,
        minutes: 10,
        baseServings: 1,
        uses: { eggs: 2, rice: 1 },
        optional: [
          { id: &quot;cabbage&quot;, name: &quot;キャベツ&quot;, amount: 80, unit: &quot;g&quot;, benefit: &quot;野菜と食べ応えを足せる&quot; },
          { id: &quot;mushroom&quot;, name: &quot;しめじ&quot;, amount: 0.25, unit: &quot;株&quot;, benefit: &quot;うま味が増す&quot; },
          { id: &quot;green-onion&quot;, name: &quot;ねぎ&quot;, amount: 0.25, unit: &quot;本&quot;, benefit: &quot;香りと彩りが出る&quot; }
        ],
        pantry: &quot;醤油・砂糖・水&quot;,
        method: &quot;野菜を煮て卵でとじ、ごはんにのせる&quot;,
        rescue: 2
      },
      {
        id: &quot;cabbage-pancake&quot;,
        name: &quot;キャベツと卵のお好み焼き風&quot;,
        minutes: 15,
        baseServings: 1,
        uses: { cabbage: 160, eggs: 1 },
        optional: [
          { id: &quot;pork&quot;, name: &quot;豚こま&quot;, amount: 80, unit: &quot;g&quot;, benefit: &quot;主菜としての満足感が増す&quot; },
          { id: &quot;cheese&quot;, name: &quot;チーズ&quot;, amount: 20, unit: &quot;g&quot;, benefit: &quot;コクが出る&quot; },
          { id: &quot;bonito&quot;, name: &quot;かつお節&quot;, amount: 1, unit: &quot;袋&quot;, benefit: &quot;香りとうま味を足せる&quot; }
        ],
        pantry: &quot;小麦粉・水・油・醤油&quot;,
        method: &quot;刻んだキャベツを生地に混ぜ、両面を焼く&quot;,
        rescue: 4
      }
    ];

    const inventoryById = () =&gt;
      inventory.reduce((result, item) =&gt; {
        result[item.id] = item;
        return result;
      }, {});

    const requiredAmount = (recipe, ingredientId) =&gt;
      (recipe.uses[ingredientId] || 0) * (servings / recipe.baseServings);

    const optionalAvailable = (option) =&gt; {
      const item = inventoryById()[option.id];
      return Boolean(item &amp;&amp; item.amount &gt;= option.amount * servings);
    };

    const optionalSetFor = (recipe) =&gt; {
      if (!optionalSelections[recipe.id]) {
        optionalSelections[recipe.id] = new Set(
          recipe.optional.filter((option) =&gt; optionalAvailable(option)).map((option) =&gt; option.id)
        );
      }
      return optionalSelections[recipe.id];
    };

    const selectedUses = (recipe) =&gt; {
      const uses = { ...recipe.uses };
      const selected = optionalSetFor(recipe);
      recipe.optional.forEach((option) =&gt; {
        if (selected.has(option.id) &amp;&amp; optionalAvailable(option)) {
          uses[option.id] = option.amount;
        }
      });
      return uses;
    };

    const shortages = (recipe) =&gt; {
      const byId = inventoryById();
      return Object.entries(recipe.uses)
        .filter(([ingredientId, amount]) =&gt; !byId[ingredientId] || byId[ingredientId].amount &lt; amount * servings)
        .map(([ingredientId, amount]) =&gt; {
          const item = byId[ingredientId];
          const lacking = amount * servings - (item ? item.amount : 0);
          const label = item ? item.name : ingredientId;
          const unit = item ? item.unit : &quot;&quot;;
          return `${label} ${formatAmount(lacking, unit)}`;
        });
    };

    const formatAmount = (value, unit) =&gt; {
      if (unit === &quot;株&quot; &amp;&amp; value === 0.25) return &quot;1/4株&quot;;
      if (unit === &quot;株&quot; &amp;&amp; value === 0.5) return &quot;1/2株&quot;;
      if (unit === &quot;本&quot; &amp;&amp; value === 0.25) return &quot;1/4本&quot;;
      if (unit === &quot;小さじ&quot; || unit === &quot;大さじ&quot;) return `${unit}${value}`;
      return `${Number.isInteger(value) ? value : value.toFixed(1)}${unit}`;
    };

    const scoreRecipe = (recipe) =&gt; {
      const missingCount = shortages(recipe).length;
      if (priority === &quot;rescue&quot;) return recipe.rescue * 10 - missingCount * 20 - recipe.minutes / 10;
      if (priority === &quot;quick&quot;) return 40 - recipe.minutes - missingCount * 20;
      return 40 - missingCount * 30 - recipe.minutes / 20;
    };

    const sortedRecipes = () =&gt; [...recipes].sort((a, b) =&gt; scoreRecipe(b) - scoreRecipe(a));

    const selectedRecipe = () =&gt;
      recipes.find((recipe) =&gt; recipe.id === selectedRecipeId) || sortedRecipes()[0];

    const renderShelf = () =&gt; {
      const activeUses = selectedUses(selectedRecipe());
      const availableCount = inventory.filter((item) =&gt; item.amount &gt; 0).length;
      inventorySummary.textContent = `冷蔵庫に${availableCount}品`;
      shelf.innerHTML = inventory
        .map((item) =&gt; {
          const used = activeUses[item.id] &amp;&amp; item.amount &gt; 0;
          const amountText = item.amount &lt;= 0 ? &quot;使い切り&quot; : item.display;
          return `
            &lt;li class=&quot;fdp-shelf-item${used ? &quot; is-used&quot; : &quot;&quot;}&quot;&gt;
              &lt;span class=&quot;fdp-ingredient&quot;&gt;${item.name}&lt;/span&gt;
              &lt;span class=&quot;fdp-amount text-small&quot;&gt;${used ? &quot;使う・&quot; : &quot;&quot;}${amountText}&lt;/span&gt;
            &lt;/li&gt;
          `;
        })
        .join(&quot;&quot;);
    };

    const renderRecipes = () =&gt; {
      const orderedRecipes = sortedRecipes();
      if (!orderedRecipes.some((recipe) =&gt; recipe.id === selectedRecipeId)) {
        selectedRecipeId = orderedRecipes[0].id;
      }
      conditionSummary.textContent = `${servings}人分・${prioritySelect.options[prioritySelect.selectedIndex].text}`;
      recipesElement.innerHTML = orderedRecipes
        .map((recipe, index) =&gt; {
          const missing = shortages(recipe);
          const selected = recipe.id === selectedRecipeId;
          const availability = missing.length
            ? `&lt;span class=&quot;fdp-missing&quot;&gt;不足：${missing.join(&quot;、&quot;)}&lt;/span&gt;`
            : &quot;今あるもので作れる&quot;;
          return `
            &lt;div class=&quot;fdp-recipe&quot;&gt;
              &lt;input type=&quot;radio&quot; name=&quot;fdp-recipe&quot; id=&quot;fdp-${recipe.id}&quot; value=&quot;${recipe.id}&quot;${selected ? &quot; checked&quot; : &quot;&quot;}&gt;
              &lt;label for=&quot;fdp-${recipe.id}&quot;&gt;
                &lt;span class=&quot;fdp-recipe-title&quot;&gt;${index + 1}. ${recipe.name}&lt;/span&gt;
                &lt;span class=&quot;fdp-recipe-meta text-small&quot;&gt;${recipe.minutes}分・${servings}人分・必須${Object.keys(recipe.uses).length}品・追加候補${recipe.optional.length}品&lt;/span&gt;
                &lt;span class=&quot;fdp-recipe-meta text-small&quot;&gt;${availability}&lt;/span&gt;
              &lt;/label&gt;
            &lt;/div&gt;
          `;
        })
        .join(&quot;&quot;);

      recipesElement.querySelectorAll(&#x27;input[name=&quot;fdp-recipe&quot;]&#x27;).forEach((input) =&gt; {
        input.addEventListener(&quot;change&quot;, (event) =&gt; {
          selectedRecipeId = event.target.value;
          status.textContent = &quot;&quot;;
          renderShelf();
          renderDetail();
        });
      });
    };

    const renderDetail = () =&gt; {
      const recipe = selectedRecipe();
      const byId = inventoryById();
      const requiredText = Object.keys(recipe.uses)
        .map((ingredientId) =&gt; {
          const item = byId[ingredientId];
          return `${item.name} ${formatAmount(requiredAmount(recipe, ingredientId), item.unit)}`;
        })
        .join(&quot;、&quot;);
      const uses = selectedUses(recipe);
      const remainingText = inventory
        .map((item) =&gt; {
          const planned = (uses[item.id] || 0) * servings;
          const remaining = Math.max(0, item.amount - planned);
          return remaining &gt; 0 ? `${item.name} ${formatAmount(remaining, item.unit)}` : &quot;&quot;;
        })
        .filter(Boolean)
        .join(&quot;、&quot;) || &quot;登録食材は使い切り&quot;;
      const selected = optionalSetFor(recipe);
      const optionalMarkup = recipe.optional
        .map((option) =&gt; {
          const available = optionalAvailable(option);
          const checked = available &amp;&amp; selected.has(option.id) ? &quot; checked&quot; : &quot;&quot;;
          const disabled = available ? &quot;&quot; : &quot; disabled&quot;;
          const statusText = available ? &quot;冷蔵庫にある&quot; : &quot;未登録・なくても作れる&quot;;
          return `
            &lt;div class=&quot;fdp-option-row&quot;&gt;
              &lt;label class=&quot;form-check&quot; for=&quot;fdp-option-${recipe.id}-${option.id}&quot;&gt;
                &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;fdp-option-${recipe.id}-${option.id}&quot; data-optional=&quot;${option.id}&quot;${checked}${disabled}&gt;
                &lt;span class=&quot;form-check-label&quot;&gt;
                  ${option.name} ${formatAmount(option.amount * servings, option.unit)}
                  &lt;span class=&quot;fdp-option-note text-small&quot;&gt;${option.benefit}&lt;/span&gt;
                &lt;/span&gt;
              &lt;/label&gt;
              &lt;span class=&quot;text-small&quot;&gt;${statusText}&lt;/span&gt;
            &lt;/div&gt;
          `;
        })
        .join(&quot;&quot;);
      const missing = shortages(recipe);
      const actionDisabled = missing.length &gt; 0 ? &quot; disabled&quot; : &quot;&quot;;
      const actionLabel = missing.length &gt; 0 ? &quot;分量不足のため選べません&quot; : &quot;これに決める&quot;;

      detail.innerHTML = `
        &lt;div class=&quot;fdp-detail-head&quot;&gt;
          &lt;div&gt;
            &lt;span class=&quot;fdp-detail-label text-small&quot;&gt;選んだ案&lt;/span&gt;
            &lt;h3&gt;${recipe.name}&lt;/h3&gt;
          &lt;/div&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;${recipe.minutes}分&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fdp-detail-grid&quot;&gt;
          &lt;div&gt;
            &lt;span class=&quot;fdp-detail-label text-small&quot;&gt;最低限必要&lt;/span&gt;
            &lt;span&gt;${requiredText}&lt;br&gt;${recipe.pantry}&lt;/span&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;span class=&quot;fdp-detail-label text-small&quot;&gt;作った後&lt;/span&gt;
            &lt;span&gt;${remainingText}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fdp-options&quot;&gt;
          &lt;span class=&quot;fdp-detail-label text-small&quot;&gt;あるとより良い&lt;/span&gt;
          &lt;div class=&quot;fdp-option-list&quot;&gt;${optionalMarkup}&lt;/div&gt;
        &lt;/div&gt;
        &lt;p&gt;&lt;span class=&quot;fdp-detail-label text-small&quot;&gt;料理の型&lt;/span&gt;${recipe.method}&lt;/p&gt;
        &lt;div class=&quot;fdp-actions&quot;&gt;
          &lt;span class=&quot;text-small&quot;&gt;${missing.length ? `必要な買い足し：${missing.join(&quot;、&quot;)}` : &quot;買い足しなしで作れます&quot;}&lt;/span&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-primary btn-block&quot; id=&quot;fdp-choose&quot;${actionDisabled}&gt;${actionLabel}&lt;/button&gt;
        &lt;/div&gt;
      `;

      const chooseButton = detail.querySelector(&quot;#fdp-choose&quot;);
      chooseButton.addEventListener(&quot;click&quot;, () =&gt; {
        applyRecipe(recipe);
      });
      detail.querySelectorAll(&quot;[data-optional]&quot;).forEach((checkbox) =&gt; {
        checkbox.addEventListener(&quot;change&quot;, (event) =&gt; {
          const selection = optionalSetFor(recipe);
          if (event.target.checked) {
            selection.add(event.target.dataset.optional);
          } else {
            selection.delete(event.target.dataset.optional);
          }
          renderShelf();
          renderDetail();
        });
      });
    };

    const applyRecipe = (recipe) =&gt; {
      const uses = selectedUses(recipe);
      inventory = inventory.map((item) =&gt; {
        const used = (uses[item.id] || 0) * servings;
        if (!used) return item;
        const nextAmount = Math.max(0, item.amount - used);
        return {
          ...item,
          amount: nextAmount,
          display: nextAmount &lt;= 0 ? &quot;使い切り&quot; : formatAmount(nextAmount, item.unit)
        };
      });
      status.textContent = `「${recipe.name}」を作る前提で、冷蔵庫の残量を更新しました。`;
      renderAll();
    };

    const renderAll = () =&gt; {
      renderRecipes();
      renderShelf();
      renderDetail();
    };

    servingsControls.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        servings = Number(button.dataset.servings);
        servingsControls.forEach((candidate) =&gt; {
          const active = candidate === button;
          candidate.classList.toggle(&quot;btn-primary&quot;, active);
          candidate.setAttribute(&quot;aria-pressed&quot;, String(active));
        });
        status.textContent = &quot;&quot;;
        renderAll();
      });
    });

    prioritySelect.addEventListener(&quot;change&quot;, () =&gt; {
      priority = prioritySelect.value;
      selectedRecipeId = sortedRecipes()[0].id;
      status.textContent = &quot;&quot;;
      renderAll();
    });

    renderAll();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
