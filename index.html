<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e6">
  <meta name="description" content="冷蔵庫の在庫を管理し、残っている食材から今日作れる料理を提案するスマホ向けプロトタイプ">
  <title>冷蔵庫の現在地</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <p class="eyebrow">台所の在庫帳</p>
      <div class="header-line">
        <h1>冷蔵庫の現在地</h1>
        <span class="save-status" id="save-status">この端末に保存</span>
      </div>
    </header>

    <main>
      <section class="view" id="inventory-view" aria-labelledby="inventory-title">
        <div class="inventory-overview">
          <div>
            <h2 id="inventory-title">今あるもの</h2>
            <p class="overview-copy" id="inventory-overview" aria-live="polite"></p>
          </div>
          <button class="button button-primary add-button" type="button" id="add-ingredient">
            ＋ 食材を追加
          </button>
        </div>

        <section class="fridge-visual" aria-labelledby="fridge-visual-title">
          <div class="fridge-visual-heading">
            <div>
              <p class="eyebrow">扉をひらいて確認</p>
              <h3 id="fridge-visual-title">わたしの冷蔵庫</h3>
            </div>
            <p>食材をタップすると<br>残量を編集できます</p>
          </div>
          <div id="fridge-scene"></div>
        </section>

        <div class="inventory-tools-heading">
          <strong>在庫を整える</strong>
          <span>残量変更・使い切り・削除</span>
        </div>

        <div class="storage-tabs" role="group" aria-label="保存場所で絞り込む">
          <button type="button" class="storage-tab is-active" data-location="すべて" aria-pressed="true">すべて</button>
          <button type="button" class="storage-tab" data-location="冷蔵" aria-pressed="false">冷蔵</button>
          <button type="button" class="storage-tab" data-location="冷凍" aria-pressed="false">冷凍</button>
          <button type="button" class="storage-tab" data-location="常温" aria-pressed="false">常温</button>
        </div>

        <div class="inventory-list" id="inventory-list" aria-live="polite"></div>

        <details class="finished-section" id="finished-section">
          <summary>
            <span>最近使い切ったもの</span>
            <span class="finished-count" id="finished-count">0品</span>
          </summary>
          <div id="finished-list"></div>
        </details>

        <p class="privacy-note">在庫データは、この端末のブラウザ内だけに保存されます。</p>
      </section>

      <section class="view" id="suggestions-view" aria-labelledby="suggestions-title" hidden>
        <div class="suggestion-heading">
          <div>
            <p class="eyebrow">冷蔵庫から選ぶ</p>
            <h2 id="suggestions-title">今日の三択</h2>
          </div>
          <button class="button button-secondary" type="button" id="review-inventory">在庫を確認</button>
        </div>

        <div class="meal-controls" aria-label="料理の提案条件">
          <fieldset>
            <legend>何人分？</legend>
            <div class="serving-buttons" id="serving-buttons">
              <button type="button" class="choice-button is-active" data-servings="1" aria-pressed="true">1人</button>
              <button type="button" class="choice-button" data-servings="2" aria-pressed="false">2人</button>
              <button type="button" class="choice-button" data-servings="4" aria-pressed="false">4人</button>
            </div>
          </fieldset>

          <label for="priority-select">
            今いちばん大事なこと
            <select id="priority-select">
              <option value="no-shop">買い足しなし</option>
              <option value="rescue">使い切り優先</option>
              <option value="quick">短時間で作る</option>
            </select>
          </label>
        </div>

        <div class="recipe-list" id="recipe-list" aria-live="polite"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主な画面">
      <button type="button" class="nav-button is-active" data-view="inventory" aria-current="page">
        <span aria-hidden="true">▤</span>
        冷蔵庫
      </button>
      <button type="button" class="nav-button" data-view="suggestions">
        <span aria-hidden="true">⌁</span>
        今日の三択
      </button>
    </nav>
  </div>

  <dialog class="ingredient-dialog" id="ingredient-dialog">
    <form id="ingredient-form">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">在庫を整える</p>
          <h2 id="dialog-title">食材を追加</h2>
        </div>
        <button class="icon-button" type="button" id="close-dialog" aria-label="閉じる">×</button>
      </div>

      <input type="hidden" id="ingredient-id">

      <label for="ingredient-name">
        食材名
        <input id="ingredient-name" name="name" type="text" autocomplete="off" required placeholder="例：キャベツ">
      </label>

      <div class="form-grid">
        <label for="ingredient-quantity">
          残量
          <input id="ingredient-quantity" name="quantity" type="number" inputmode="decimal" min="0.25" step="0.25" required value="1">
        </label>

        <label for="ingredient-unit">
          単位
          <select id="ingredient-unit" name="unit">
            <option value="個">個</option>
            <option value="g">g</option>
            <option value="ml">ml</option>
            <option value="本">本</option>
            <option value="株">株</option>
            <option value="袋">袋</option>
            <option value="パック">パック</option>
            <option value="膳">膳</option>
          </select>
        </label>
      </div>

      <label for="ingredient-location">
        保存場所
        <select id="ingredient-location" name="location">
          <option value="冷蔵">冷蔵</option>
          <option value="冷凍">冷凍</option>
          <option value="常温">常温</option>
        </select>
      </label>

      <label class="check-row" for="ingredient-priority">
        <input id="ingredient-priority" name="priority" type="checkbox">
        <span>
          <strong>使い切り優先にする</strong>
          <small>料理の提案で先に使う候補にします</small>
        </span>
      </label>

      <div class="dialog-actions">
        <button class="button button-danger" type="button" id="delete-ingredient" hidden>在庫から削除</button>
        <button class="button button-secondary" type="button" id="cancel-dialog">キャンセル</button>
        <button class="button button-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button type="button" id="toast-action" hidden>戻す</button>
  </div>
</body>
</html>
